<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieAI Lab | Живий чат</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <a class="brand" href="index.html">MovieAI Lab</a>
      <nav aria-label="Основна навігація">
        <ul class="nav-list">
          <li><a href="index.html">Головна</a></li>
          <li><a href="movies.html">Фільми</a></li>
          <li><a href="search-results.html?q=%D0%B4%D1%80%D0%B0%D0%BC%D0%B0">Пошук</a></li>
          <li><a href="chat.html" class="is-active">Чат</a></li>
          <li><a href="login.html">Вхід</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <article class="panel chat-shell">
          <h1>Live WebSocket Chat</h1>
          <p class="muted">Підключіться до сервера й отримайте миттєву відповідь від чат-помічника. Це демонстрація додаткової live-функціональності для SPA.</p>
          <div id="chat-status" class="chat-status">Підключення до сервера...</div>
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="simple-form chat-form">
            <label for="chat-input">Ваше повідомлення</label>
            <textarea id="chat-input" rows="4" placeholder="Напишіть мені про фільм, жанр або настрій..." required></textarea>
            <button id="chat-send" class="btn btn-primary" type="submit">Надіслати</button>
          </form>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 MovieAI Lab.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
